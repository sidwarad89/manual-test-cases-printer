# Generated by QA Agent Builder for Selenium
# NOTE: the browser must run HEADED for video to capture anything.
# Xvfb provides a virtual display, so remove any --headless flag from
# your driver options and the run will still work on CI.
name: Run generated tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Install screen recording tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
      - name: Start virtual display and begin recording
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 3
          ffmpeg -y -f x11grab -video_size 1920x1080 -i :99 -codec:v libx264 -r 15 test-run.mp4 &
          echo $! > ffmpeg.pid
      - name: Run tests
        env:
          DISPLAY: ':99'
        run: pytest tests/ -v || true
      - name: Stop recording
        if: always()
        run: |
          kill "$(cat ffmpeg.pid)" 2>/dev/null || true
          sleep 4
      - name: Upload video and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            test-run.mp4
            test-results/
            results/
            reports/
            target/surefire-reports/
          if-no-files-found: ignore

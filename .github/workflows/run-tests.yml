name: Run Android Selenium Tests

on:
  push:
    branches: [ "**" ]

jobs:
  android-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg

      - name: Start virtual X server
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Record test run
        id: record
        run: |
          ffmpeg -y -video_size 1920x1080 -framerate 15 -f x11grab -i :99 -c:v libx264 -preset veryfast -crf 23 test-run.mp4 &
          echo "FFMPEG_PID=$!" >> $GITHUB_ENV

      - name: Run tests
        env:
          DISPLAY: ":99"
        run: |
          source venv/bin/activate
          pytest src/test/python/tests --junitxml=report.xml
          # Stop ffmpeg after tests finish
          kill $FFMPEG_PID

      - name: Upload test video and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            test-run.mp4
            report.xml
          if-no-files-found: ignore
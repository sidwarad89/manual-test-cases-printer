# Generated by QA Agent Builder for Selenium
# NOTE: the browser must run HEADED for video to capture anything.
# Xvfb provides a virtual display, so remove any --headless flag from
# your driver options and the run will still work on CI.
name: Run generated tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Creating a branch is itself a push event, so without this the
    # branch-creation fires a duplicate run at the same commit.
    if: github.event.created != true
    # Never let a hung browser hold a runner for hours.
    timeout-minutes: 20
    env:
      DISPLAY: ':99'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Install screen recording tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
      - name: Start virtual display and begin recording
        run: |
          # Both are redirected to log files and detached. Leaving
          # their output attached keeps this step's pipe open, so the
          # step never finishes, the tests never run, and the job
          # hangs until it times out with an empty video.
          nohup Xvfb :99 -screen 0 1920x1080x24 > xvfb.log 2>&1 &
          sleep 3
          # -pix_fmt yuv420p is required for the file to play in
          # QuickTime, Windows Media Player and most browsers.
          nohup ffmpeg -nostdin -y -f x11grab -video_size 1920x1080 -i :99 \
            -codec:v libx264 -pix_fmt yuv420p -preset ultrafast -r 15 \
            -movflags +faststart test-run.mp4 > ffmpeg.log 2>&1 &
          echo $! > ffmpeg.pid
          sleep 2
          echo "Recorder started (pid $(cat ffmpeg.pid))"
      - name: Run tests
        run: pytest tests/ -v || true
      - name: Stop recording
        if: always()
        run: |
          # SIGINT (not SIGTERM/kill) lets ffmpeg write the MP4 index.
          # Killing it outright leaves a truncated, unplayable file -
          # which is what 'unsupported format' actually means.
          if [ -s ffmpeg.pid ]; then
            kill -INT "$(cat ffmpeg.pid)" 2>/dev/null || true
            for i in $(seq 1 20); do
              kill -0 "$(cat ffmpeg.pid)" 2>/dev/null || break
              sleep 1
            done
          else
            echo 'No recorder pid file - nothing to stop'
          fi
          ls -lh test-run.mp4 || echo 'No video produced'
          # A tiny file means nothing was drawn on the display -
          # usually the browser never launched. Show why.
          if [ ! -s test-run.mp4 ] || [ "$(stat -c%s test-run.mp4 2>/dev/null || echo 0)" -lt 20000 ]; then
            echo '--- ffmpeg log ---'; tail -20 ffmpeg.log 2>/dev/null || true
            echo '--- xvfb log ---'; tail -20 xvfb.log 2>/dev/null || true
          fi
      - name: Upload video and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            test-run.mp4
            test-results/
            results/
            reports/
            target/surefire-reports/
          if-no-files-found: ignore
      - name: Report result to QA Agent Builder
        if: always()
        continue-on-error: true
        env:
          QA_AGENT_TOKEN: ${{ secrets.QA_AGENT_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          CALLBACK_URL: https://qa-agent-platform.onrender.com/api/ci/result
        run: |
          if [ -z "$QA_AGENT_TOKEN" ]; then
            echo 'No QA_AGENT_TOKEN secret set - skipping report.'; exit 0
          fi
          tail -c 8000 ci-output.log > ci-tail.txt 2>/dev/null || echo 'no log captured' > ci-tail.txt
          if [ "$JOB_STATUS" = "success" ]; then export STATUS=success; else export STATUS=failure; fi
          python3 - > payload.json <<'PYEOF'
          import json, os
          server = os.environ.get('GITHUB_SERVER_URL', '')
          repo = os.environ.get('GITHUB_REPOSITORY', '')
          run_id = os.environ.get('GITHUB_RUN_ID', '')
          print(json.dumps({
              'status': os.environ.get('STATUS', 'failure'),
              'repo': repo,
              'branch': os.environ.get('GITHUB_REF_NAME', ''),
              'commit_sha': os.environ.get('GITHUB_SHA', ''),
              'commit_author': os.environ.get('GITHUB_ACTOR', ''),
              'run_url': server + '/' + repo + '/actions/runs/' + run_id,
              'log_tail': open('ci-tail.txt').read(),
          }))
          PYEOF
          curl -sS -X POST "$CALLBACK_URL" \
            -H "Authorization: Bearer $QA_AGENT_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @payload.json --max-time 20 || true

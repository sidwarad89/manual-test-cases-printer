name: Run Android UI Tests

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DISPLAY: ':99'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (ffmpeg & xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start virtual X server
        run: |
          Xvfb ${{ env.DISPLAY }} -screen 0 1280x720x24 &
          # Give Xvfb a moment to start
          sleep 3

      - name: Start video recording
        id: start_recording
        run: |
          ffmpeg -y -video_size 1280x720 -framerate 25 -f x11grab -i ${{ env.DISPLAY }} -c:v libx264 test-run.mp4 &
          echo "record_pid=$!" >> $GITHUB_OUTPUT
          # Give ffmpeg a moment to initialize
          sleep 2

      - name: Run pytest (only test directory)
        run: |
          pytest src/test/python/tests -q --junitxml=reports.xml

      - name: Stop video recording
        if: always()
        run: |
          kill ${{ steps.start_recording.outputs.record_pid }} || true

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            test-run.mp4
            reports.xml
          if-no-files-found: ignore
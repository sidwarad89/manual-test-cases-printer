name: Run Selenium Tests

on:
  push:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Xvfb and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg

      - name: Start Xvfb
        id: xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          echo $! > xvfb.pid
        env:
          DISPLAY: :99

      - name: Record test run video
        id: record
        run: |
          ffmpeg -y -video_size 1920x1080 -framerate 15 -f x11grab -i :99 -codec:v libx264 -preset veryfast -crf 23 test-run.mp4 &
          echo $! > ffmpeg.pid
        env:
          DISPLAY: :99

      - name: Run tests
        run: |
          pytest tests/ --junitxml=report.xml
        env:
          DISPLAY: :99

      - name: Stop recording
        if: always()
        run: |
          if [ -f ffmpeg.pid ] && kill -0 $(cat ffmpeg.pid) 2>/dev/null; then
            kill $(cat ffmpeg.pid)
            wait $(cat ffmpeg.pid) || true
          fi

      - name: Stop Xvfb
        if: always()
        run: |
          if [ -f xvfb.pid ] && kill -0 $(cat xvfb.pid) 2>/dev/null; then
            kill $(cat xvfb.pid)
            wait $(cat xvfb.pid) || true
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            test-run.mp4
            report.xml
          if-no-files-found: ignore